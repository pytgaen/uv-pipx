# ruff.toml

# Target the minimum supported Python version.
target-version = "py310"

# Maximum line length (kept in sync with the formatter).
line-length = 140

# --- Linter configuration ---
[lint]

# Selected rule sets (balanced but a bit strict).
select = [
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
    "F",    # Pyflakes errors (undefined vars, unused imports)
    "I",    # isort (import sorting)
    "UP",   # Pyupgrade (modernize syntax)
    "B",    # Bugbear (design issues, potential bugs)
    "C90",  # McCabe complexity (C901 = "function too complex")
    "SIM",  # Simplification suggestions
    "PTH",  # Use pathlib instead of os.path
    "S",    # Security rules (flake8-bandit)
    "PT",   # pytest style and best practices
]

# Globally ignored rules.
ignore = [
    "E501", # Line too long (delegated to the formatter)
    "B008", # Allow function calls in default args
    "E402", # Allow imports not strictly at the top
]

# Per-file ignores.
[lint.per-file-ignores]
# In __init__.py files, allow unused imports (F401).
"__init__.py" = ["F401"]

# Relax some rules in test files.
"tests/**/*.py" = [
    "S101",   # Allow 'assert' statements
    "C901",   # Allow complex functions
    "SLF001", # Allow access to private members (e.g. obj._private)
]
"*_test.py" = [
    "S101",
    "C901",
    "SLF001",
]
"test_*.py" = [
    "S101",
    "C901",
    "SLF001",
]

# --- isort configuration (via Ruff) ---
[lint.isort]
# Replace "src" with the name of your main package / source directory.
known-first-party = ["src"]

# --- Formatter configuration (Black-style) ---
[format]

# Preferred quote style ("double" or "single").
quote-style = "double"

# Indentation style (always "space" in Python).
indent-style = "space"

# Let Ruff handle line endings (LF vs CRLF) automatically.
line-ending = "auto"
