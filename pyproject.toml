[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "uvpipx"
description = "A small tool like pipx using uv behind the scene. Fast, Small ..."
version = "0.8.1" # to bump
authors = [
    { name = "Pytgaen", email = "32298455+pytgaen@users.noreply.github.com" }
]
readme = "README.md"
license = { text = "GPL" }
requires-python = ">=3.10"
dependencies = [
    "uv>=0.6.0,<1.0.0",
]

[project.urls]
Homepage = "https://uvpipx-pytgaen-group-cc4651f865d7ce5bdaea510cdc656d736634827532.gitlab.io"
Repository = "https://gitlab.com/pytgaen-group/uvpipx"
# Documentation = "https://gitlab.com/pytgaen-group/uvpipx" # gitlab page

[project.scripts]
uvpipx = "uvpipx.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    # mkdocs
    "mkdocs==1.6.0",
    "mkdocs-material-extensions==1.3.1",
    "mkdocs-material==9.5.25",
    "mkdocs-mermaid2-plugin==1.1.1",
    "mkdocs-minify-plugin==0.8.0",
    "pymdown-extensions==10.8.1",
    "mkdocstrings[python]>=0.25.1",
    # stranges should be managed by mkdocs
    "mergedeep==1.3.4",
    "pyyaml-env-tag==0.1",
    "pathspec==0.12.1",
    "watchdog>=4.0.1",
    "regex>=2024.5.15",
    # testing and type checking
    "basedpyright>=1.22.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["uvpipx"]

